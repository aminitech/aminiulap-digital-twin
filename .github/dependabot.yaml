# === START STANDARD CONFIG ===
version: 2
updates:
  # Monthly and grouped: action bumps used to arrive as one PR per action per week,
  # each running the repo's full CI. Security advisories are not affected, since
  # Dependabot security updates ignore the schedule.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    # The Security Scan workflow is bumped centrally, together with the scan
    # runner group's list of allowed refs: a ref missing from that list leaves the
    # repository's scans queued (onprem-infra terraform/network/runner-scan).
    ignore:
      - dependency-name: "aminitech/.github/.github/workflows/reusable-security-scan.yaml"
# === END STANDARD CONFIG ===
