name: ulap-scope CI

# Runs the FAST unit suite (geo math, config/portability, manifest schema).
# The `-m rt` integration tests need Blender + Sionna and are NOT run in CI.
#
# Monorepo note: this file assumes the Ulap One layout where the package lives at
# `ulap-scope/`. If `ulap-scope` is itself the repo root, set
# `defaults.run.working-directory` to `.` and drop the `paths:` prefix.

on:
  push:
    paths: ["ulap-scope/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["ulap-scope/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ulap-scope

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (test extra)
        run: python -m pip install -e ".[test]"

      - name: Fast unit suite
        run: python -m pytest -q

      - name: Package imports cleanly
        run: python -c "import ulap_scope; print('ulap_scope', ulap_scope.__version__)"
