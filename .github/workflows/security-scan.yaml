# Security Scan (public-safe)
#
# WHY THIS FILE IS NOT THE SHARED REUSABLE WORKFLOW
# -------------------------------------------------
# This repository is PUBLIC. The org's shared scan lives in aminitech/.github,
# which is INTERNAL. GitHub does not let a public repository call a reusable
# workflow from an internal one, so every run of the previous version failed at
# the workflow-resolution stage -- 0 seconds, no jobs, before any step existed:
#
#     failed to parse workflow: error parsing called workflow
#     "aminitech/.github/.github/workflows/reusable-security-scan.yaml@<sha>"
#     : workflow was not found
#
# That is why bumping the pin (v1.5.0 -> v1.6.2) never helped: the pin was never
# the problem. The break dates from the repo being made public for the
# open-source scrub, not from any change to the scan.
#
# Two further reasons a verbatim copy of the internal workflow would not work
# here:
#   1. It requires SEMGREP_APP_TOKEN and AWS_BEARER_TOKEN_BEDROCK. This repo has
#      no repository secrets, and its AI-review gate is FAIL-CLOSED -- so a
#      verbatim copy would block every pull request instead of scanning it.
#   2. GitHub does not expose secrets to pull requests from FORKS. Since this
#      repo is public specifically so third parties can reproduce the results,
#      a secret-dependent gate would block exactly the contributors it exists
#      to serve.
#
# So this is a deliberately secret-free scan: Semgrep (SAST) + Trivy
# (dependency/filesystem CVEs). It runs identically for maintainers and for
# fork pull requests. The internal AI-security-review gate stays internal-only
# and is NOT reproduced here -- publishing Amini's gating logic in a public repo
# would disclose it as surely as making aminitech/.github public would.

name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      # Explicit registry rulesets, NOT `--config auto`: auto asks the Semgrep
      # service to choose rules for this repo and therefore refuses to run with
      # `--metrics off` ("Cannot create auto config when metrics are off").
      # Naming the packs keeps telemetry off AND makes the rule set deterministic,
      # so a scan result changes only when this file changes. No
      # SEMGREP_APP_TOKEN is needed, so this works on fork pull requests too.
      # Findings are reported as SARIF; the step is non-fatal and the gate below
      # decides what blocks.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/ci \
            --sarif --output semgrep.sarif \
            --metrics off \
            --no-error \
            .

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on ERROR-severity findings
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("semgrep.sarif")
          if not p.exists():
              print("no SARIF produced; nothing to gate on")
              sys.exit(0)
          sarif = json.loads(p.read_text())
          blocking = []
          for run in sarif.get("runs", []):
              rules = {r.get("id"): r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for res in run.get("results", []):
                  lvl = res.get("level") or rules.get(res.get("ruleId"), {}).get("defaultConfiguration", {}).get("level")
                  if lvl == "error":
                      loc = res.get("locations", [{}])[0].get("physicalLocation", {})
                      f = loc.get("artifactLocation", {}).get("uri", "?")
                      ln = loc.get("region", {}).get("startLine", "?")
                      blocking.append(f"{f}:{ln}  {res.get('ruleId')}")
          if blocking:
              print(f"{len(blocking)} ERROR-severity Semgrep finding(s):")
              for b in blocking:
                  print("  -", b)
              sys.exit(1)
          print("no ERROR-severity Semgrep findings")
          PY

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  dependencies:
    name: trivy (dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Blocks on CRITICAL/HIGH that have a fix available. Unfixed findings are
      # reported but do not block -- matching the internal scan's posture, where
      # a dependency finding with no upstream fix is information, not a gate.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
