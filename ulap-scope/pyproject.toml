[build-system]
# setuptools>=77 is the first release that accepts a PEP 639 SPDX expression in
# `project.license` and emits it as the `License-Expression` core metadata field.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulap-scope"
version = "0.1.0"
description = "Barbados / Newton digital-twin RF pipeline (BlenderGIS -> Mitsuba -> Sionna RT) for Ulap One"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX expression. Must match the repository LICENSE file (Apache-2.0),
# CITATION.cff and the licence section of the top-level README.
license = "Apache-2.0"
authors = [{ name = "Ulap One" }]
# Core import surface (geo + config + CLI orchestration) is light. The heavy,
# env-specific deps (geopandas / bpy / sionna-rt) are installed per stage-env
# from requirements/*.txt -- see README.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
prep = ["geopandas>=1.0", "scipy>=1.11", "pyproj>=3.6", "pillow>=10"]
rt   = ["sionna-rt==2.0.1", "matplotlib>=3.8"]
test = ["pytest>=8", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
ulap-scope = "ulap_scope.cli:main"

[tool.setuptools]
packages = ["ulap_scope", "ulap_scope.stages"]

[tool.setuptools.package-data]
"ulap_scope.stages" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rt: integration test that requires the Sionna RT env"]
# fast suite by default; run RT smoke explicitly with `-m rt` in the sionna env
addopts = "-m 'not rt' -q"
